<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- network dots -->
  <g stroke="#7dd3fc" stroke-opacity="0.35" fill="none" stroke-width="1.5">
    <line x1="60" y1="70" x2="130" y2="45"/><line x1="130" y1="45" x2="95" y2="120"/>
    <line x1="1090" y1="70" x2="1150" y2="110"/><line x1="1090" y1="70" x2="1130" y2="40"/>
  </g>
  <circle cx="60" cy="70" r="3.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="130" cy="45" r="3" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="95" cy="120" r="2.5" fill="#7dd3fc" opacity="0.45"/>
  <circle cx="1090" cy="70" r="3.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="1150" cy="110" r="3" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="1130" cy="40" r="2.5" fill="#7dd3fc" opacity="0.45"/>

  <text x="72" y="118" fill="#ffffff" font-size="50" font-weight="700">frp 服务端面板 · 完整中文汉化包</text>
  <text x="74" y="166" fill="#a5f3fc" font-size="22" font-weight="500">frps Dashboard 硬编码英文？一套静态资源，一键换中文</text>

  <g font-size="16" fill="#ffffff">
    <rect x="74" y="200" width="168" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="158" y="226" text-anchor="middle">零侵入替换</text>
    <rect x="256" y="200" width="168" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="340" y="226" text-anchor="middle">无需换二进制</text>
    <rect x="438" y="200" width="168" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="522" y="226" text-anchor="middle">无需 Docker</text>
    <rect x="620" y="200" width="150" height="40" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="695" y="226" text-anchor="middle">v0.71.0</text>
  </g>

  <!-- right: browser mock -->
  <g transform="translate(830, 62)">
    <rect width="310" height="176" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35"/>
    <rect x="0" y="0" width="310" height="30" rx="12" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="18" cy="15" r="4" fill="#f87171"/><circle cx="34" cy="15" r="4" fill="#fbbf24"/><circle cx="50" cy="15" r="4" fill="#34d399"/>
    <text x="155" y="19" fill="#e2e8f0" font-size="11" text-anchor="middle" font-family="Consolas,monospace">frps:7500 — frp 服务端面板</text>
    <rect x="16" y="44" width="120" height="22" rx="6" fill="#22d3ee" fill-opacity="0.25"/>
    <text x="76" y="59" fill="#67e8f9" font-size="12" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif">总览</text>
    <text x="76" y="90" fill="#cbd5e1" font-size="12" font-family="'Microsoft YaHei',sans-serif">客户端</text>
    <text x="76" y="112" fill="#cbd5e1" font-size="12" font-family="'Microsoft YaHei',sans-serif">代理</text>
    <rect x="150" y="44" width="80" height="18" rx="9" fill="#10b981" fill-opacity="0.3"/>
    <text x="190" y="57" fill="#6ee7b7" font-size="11" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif">● 在线</text>
    <rect x="150" y="72" width="80" height="18" rx="9" fill="#f59e0b" fill-opacity="0.25"/>
    <text x="190" y="85" fill="#fcd34d" font-size="11" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif">已连接</text>
    <text x="150" y="120" fill="#e2e8f0" font-size="12" font-family="'Microsoft YaHei',sans-serif">今日流量：2.4 GB</text>
    <text x="150" y="142" fill="#94a3b8" font-size="12" font-family="'Microsoft YaHei',sans-serif">连接数：36 / 清理离线</text>
    <text x="155" y="167" fill="#7dd3fc" font-size="11" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif">界面 100% 中文化 ✓</text>
